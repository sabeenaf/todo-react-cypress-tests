name: Cypress CI

on:
  push:
    branches:
      - main
      - '*'          
  pull_request:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 15.6.0  # Install Cypress 15.6

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js compatible with Cypress
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.19

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run Cypress tests with JUnit reporter
      - name: Run Cypress tests
        run: |
          mkdir -p cypress/results
          npx cypress run \
            --reporter mocha-junit-reporter \
            --reporter-options "mochaFile=cypress/results/results-[hash].xml"

      # Upload screenshots, videos, and test results as artifacts
      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            cypress/results
